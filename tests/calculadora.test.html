<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Calculadora</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color: #1A1D29; }
    table { border-collapse: collapse; width: 100%; max-width: 960px; }
    th, td { border: 1px solid #DCDFE7; padding: 6px 10px; text-align: left; font-size: 14px; }
    .ok { color: #156B43; font-weight: 700; }
    .fallo { color: #B42318; font-weight: 700; }
    #resumen { font-size: 18px; font-weight: 700; margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Pruebas unitarias de la calculadora</h1>
  <p>Abre este archivo en el navegador (o sírvelo junto al sitio). Cada fila compara el valor obtenido con el esperado.</p>
  <p id="resumen">Ejecutando…</p>
  <table>
    <thead><tr><th>Caso</th><th>Esperado</th><th>Obtenido</th><th>Resultado</th></tr></thead>
    <tbody id="filas"></tbody>
  </table>

  <script src="../assets/js/calculadora.js?v=20261012" defer></script>
  <script>
    // Las pruebas se ejecutan cuando el script diferido ya se ha cargado
    document.addEventListener("DOMContentLoaded", function () {
      var C = window.TrazabisCalc;
      var NBSP = " ";
      var casos = [];
      function caso(nombre, obtenido, esperado) { casos.push({ nombre: nombre, obtenido: obtenido, esperado: esperado }); }

      // Onboarding: casos exigidos por el brief
      caso("Onboarding 51 clientes", C.calcularOnboarding(51), 3000);
      caso("Onboarding 100 clientes", C.calcularOnboarding(100), 3000);
      caso("Onboarding 101 clientes", C.calcularOnboarding(101), 4000);
      caso("Onboarding 300 clientes", C.calcularOnboarding(300), 7000);
      // Onboarding: fronteras de la tabla de precios
      caso("Onboarding 150 clientes", C.calcularOnboarding(150), 4000);
      caso("Onboarding 151 clientes", C.calcularOnboarding(151), 5000);
      caso("Onboarding 200 clientes", C.calcularOnboarding(200), 5000);
      caso("Onboarding 201 clientes", C.calcularOnboarding(201), 6000);
      caso("Onboarding 250 clientes", C.calcularOnboarding(250), 6000);
      caso("Onboarding 251 clientes", C.calcularOnboarding(251), 7000);

      // Total del primer año: caso exigido por el brief (3.000 + 17.700 = 20.700)
      var r = C.calcular(100, "inicio", "despacho");
      caso("100 · Inicio · asumido: planes año 1", r.planes, 17700);
      caso("100 · Inicio · asumido: total", r.total, 20700);
      caso("100 · Inicio · asumido: total formateado", C.formatearEUR(r.total), "20.700,00" + NBSP + "€");

      // Otros planes
      caso("100 · Pro · asumido: planes año 1 (100 × 29,50 × 12)", C.calcular(100, "pro", "despacho").planes, 35400);
      caso("300 · Negocio · asumido: total (7.000 + 142.200)", C.calcular(300, "negocio", "despacho").total, 149200);
      caso("51 · Inicio · asumido: total (3.000 + 9.027)", C.calcular(51, "inicio", "despacho").total, 12027);

      // Repercutido a los clientes: solo onboarding
      var rc = C.calcular(100, "inicio", "clientes");
      caso("100 · Inicio · repercutido: planes", rc.planes, null);
      caso("100 · Inicio · repercutido: total", rc.total, 3000);

      // Fuera de rango
      caso("50 clientes → diagnóstico", C.calcular(50, "inicio", "despacho").estado, "menor");
      caso("1 cliente → diagnóstico", C.calcular(1, "inicio", "despacho").estado, "menor");
      caso("301 clientes → diagnóstico", C.calcular(301, "inicio", "despacho").estado, "mayor");
      caso("0 clientes → no válido", C.calcular(0, "inicio", "despacho").estado, "no_valido");
      caso("100,5 clientes → no válido", C.calcular(100.5, "inicio", "despacho").estado, "no_valido");

      // Formato es-ES
      caso("Formato 3000", C.formatearEUR(3000), "3.000,00" + NBSP + "€");
      caso("Formato 1234567,5", C.formatearEUR(1234567.5), "1.234.567,50" + NBSP + "€");
      caso("Formato 999", C.formatearEUR(999), "999,00" + NBSP + "€");

      // Rango de clientes para la medición
      caso("Rango 19", C.rangoClientes(19), "menos_20");
      caso("Rango 50", C.rangoClientes(50), "20_50");
      caso("Rango 51", C.rangoClientes(51), "51_100");
      caso("Rango 300", C.rangoClientes(300), "251_300");
      caso("Rango 301", C.rangoClientes(301), "mas_300");

      var fallos = 0;
      var tbody = document.getElementById("filas");
      casos.forEach(function (c) {
        var ok = c.obtenido === c.esperado;
        if (!ok) fallos++;
        var tr = document.createElement("tr");
        [c.nombre, JSON.stringify(c.esperado), JSON.stringify(c.obtenido)].forEach(function (t) {
          var td = document.createElement("td"); td.textContent = t; tr.appendChild(td);
        });
        var td = document.createElement("td");
        td.className = ok ? "ok" : "fallo";
        td.textContent = ok ? "OK" : "FALLO";
        tr.appendChild(td);
        tbody.appendChild(tr);
      });
      var resumen = document.getElementById("resumen");
      resumen.textContent = (casos.length - fallos) + " de " + casos.length + " pruebas correctas" + (fallos ? " · " + fallos + " fallos" : "");
      resumen.className = fallos ? "fallo" : "ok";
      window.__resultadoPruebas = { total: casos.length, fallos: fallos };
    });
  </script>
</body>
</html>
